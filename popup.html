<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style Scope</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="scope-shell">
      <header class="masthead">
        <div class="brand-lockup">
          <span class="scope-mark" aria-hidden="true"><i></i></span>
          <h1>Style <span>Scope</span></h1>
        </div>
        <span class="version" id="versionText"></span>
      </header>

      <section class="control-plate" aria-labelledby="control-heading">
        <h2 id="control-heading">Inspection</h2>
        <div class="setting-row">
          <div class="control-copy">
            <div class="state-line"><span class="status-orb" aria-hidden="true"></span><strong id="stateText">元素检视</strong></div>
            <p id="stateHint">已关闭</p>
          </div>
          <button id="masterToggle" class="master-toggle" type="button" role="switch" aria-checked="false" aria-label="开启元素检视">
            <span class="toggle-track"><span class="toggle-knob"></span></span>
          </button>
        </div>
      </section>

      <section class="mode-plate" aria-labelledby="mode-heading">
        <div class="section-heading">
          <h2 id="mode-heading">Panel</h2>
          <span>展示位置</span>
        </div>
        <div class="mode-selector" role="group" aria-label="信息面板位置">
          <button type="button" data-panel-mode="overlay" aria-pressed="true"><span class="mode-icon is-overlay" aria-hidden="true"></span>浮层</button>
          <button type="button" data-panel-mode="sidebar" aria-pressed="false"><span class="mode-icon is-sidebar" aria-hidden="true"></span>侧边栏</button>
        </div>
      </section>

      <section class="shortcut-plate" aria-labelledby="shortcut-heading">
        <div class="section-heading">
          <h2 id="shortcut-heading">Shortcut</h2>
          <span>开关检视</span>
        </div>
        <div class="shortcut-row">
          <button id="shortcutRecorder" class="shortcut-recorder" type="button" aria-label="自定义开关检视快捷键">
            <span id="shortcutValue">⌘ E</span>
          </button>
          <button id="shortcutReset" class="shortcut-reset" type="button" aria-label="恢复默认快捷键" title="恢复默认快捷键">↺</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
