<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style Scope · Preview</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
      :root { --demo-token-text-primary:#e9e2d5; --demo-token-action-primary:#f1b84a; --demo-token-text-secondary:#aaa398; --demo-token-border-subtle:rgba(241,184,74,.7); --vnext-bg-sub-navigation:rgba(245,245,245,.7); }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--demo-token-text-primary); background:#111211; font-family:"DM Mono", ui-monospace, monospace; }
      .paper { position:relative; min-height:100vh; overflow:hidden; padding:9vw 10vw; background:radial-gradient(circle at 78% 12%, #423414 0, transparent 24%), #141414; }
      .paper::before { content:""; position:absolute; inset:0; opacity:.18; pointer-events:none; background-image:linear-gradient(90deg, transparent 49.8%, rgba(248,234,205,.18) 50%, transparent 50.2%), linear-gradient(rgba(248,234,205,.08) 1px, transparent 1px); background-size:100% 100%, 100% 42px; }
      .kicker { position:relative; color:var(--demo-token-action-primary); font-size:10px; letter-spacing:.18em; }
      h1 { position:relative; max-width:820px; margin:19px 0 52px; font:500 clamp(52px, 8vw, 116px)/.86 "Playfair Display", Georgia, serif; letter-spacing:-.06em; }
      h1 i { color:var(--demo-token-action-primary); font-style:italic; }
      .frame { position:relative; display:grid; grid-template-columns:1fr 1.4fr; max-width:860px; min-height:300px; border:1px solid var(--demo-token-border-subtle); }
      .copy { padding:36px; border-right:1px solid rgba(241,184,74,.35); }.copy p { max-width:290px; color:var(--demo-token-text-secondary); font:16px/1.6 "Playfair Display", Georgia, serif; }.copy button { display:inline-flex; align-items:center; gap:9px; padding:12px 15px; color:#1c160b; border:0; background:var(--demo-token-action-primary); font:500 11px "DM Mono", monospace; letter-spacing:.08em; }.copy button > span { pointer-events:none; }.button-icon { font-size:15px; line-height:1; }.resource-sample, .resource-vector { display:block; width:42px; height:42px; margin-top:16px; padding:5px; border:1px solid rgba(241,184,74,.58); border-radius:9px; background:#1c1b17; object-fit:contain; }.resource-vector { padding:8px; color:var(--demo-token-action-primary); }
      .swatches { display:flex; align-items:end; gap:13px; padding:36px; }.swatch { flex:1; height:168px; background:#e6785e; box-shadow:10px 10px 0 rgba(255,255,255,.07); }.swatch:nth-child(2) { height:224px; border-radius:90px 90px 0 0; background:#78b9ad; }.swatch:nth-child(3) { height:112px; border:1px solid #e9e2d5; background:transparent; }.hint { position:fixed; right:24px; bottom:20px; color:var(--vnext-bg-sub-navigation); font-size:10px; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <main class="paper">
      <div class="kicker">A MATERIAL STUDY · 2025</div>
      <h1>Every surface<br>has a <i>story.</i></h1>
      <section class="frame">
        <div class="copy"><p>打开 Style Scope 后，把光标移到此页任意元素上，即可看到它的完整计算样式。</p><button><span class="button-icon" aria-hidden="true">✦</span><span>EXPLORE MATERIAL</span></button><img class="resource-sample" src="icons/icon128.png" alt="Style Scope logo" /><svg class="resource-vector" viewBox="0 0 24 24" aria-label="Style Scope vector mark"><path fill="currentColor" d="M12 2.2 21.8 12 12 21.8 2.2 12 12 2.2Zm0 3.2L5.4 12l6.6 6.6 6.6-6.6L12 5.4Zm0 2.9 3.7 3.7-3.7 3.7L8.3 12 12 8.3Z" /></svg></div>
        <div class="swatches"><div class="swatch"></div><div class="swatch"></div><div class="swatch"></div></div>
      </section>
      <div class="hint">STYLE SCOPE / HOVER ANY ELEMENT</div>
    </main>
    <script>
      // 演示页用极小的扩展 API 桩启用真实的内容脚本；正式使用时由浏览器扩展提供这些 API。
      const demoSettings = { enabled: true };
      window.chrome = {
        runtime: {
          onMessage: { addListener() {} },
          async sendMessage(message) {
            if (message?.type !== "style-scope:fetch-image") return undefined;
            const response = await fetch(message.url);
            const blob = await response.blob();
            const base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result).split(",", 2)[1]);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
            return { ok: response.ok, base64, mime: blob.type };
          }
        },
        storage: {
          local: {
            get(defaults, callback) { callback({ ...defaults, ...demoSettings }); },
            set(patch, callback) { Object.assign(demoSettings, patch); callback?.(); }
          },
          onChanged: { addListener() {} }
        }
      };
    </script>
    <script src="content.js?v=1.7.0"></script>
    <script>
      // 仅供截图演示：距离或包含关系的测量，普通演示页不会执行。
      const previewParams = new URLSearchParams(location.search);
      const containmentPreview = previewParams.has("containment-preview");
      const resourcePreview = previewParams.has("resource-preview");
      const blobResourcePreview = previewParams.has("blob-resource-preview");
      const svgResourcePreview = previewParams.has("svg-resource-preview");
      const svgPathResourcePreview = previewParams.has("svg-path-resource-preview");
      if (previewParams.has("distance-preview") || containmentPreview || resourcePreview || blobResourcePreview || svgResourcePreview || svgPathResourcePreview) {
        requestAnimationFrame(async () => {
          const source = document.querySelector(svgPathResourcePreview ? ".resource-vector path" : svgResourcePreview ? ".resource-vector" : resourcePreview || blobResourcePreview ? ".resource-sample" : containmentPreview ? ".copy" : ".copy button");
          if (blobResourcePreview) {
            const response = await fetch(source.src);
            source.src = URL.createObjectURL(await response.blob());
            await source.decode();
          }
          const target = resourcePreview || blobResourcePreview || svgResourcePreview || svgPathResourcePreview ? source : document.querySelector(containmentPreview ? ".copy button" : ".swatch:nth-child(3)");
          source.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
          requestAnimationFrame(() => {
            const rect = target.getBoundingClientRect();
            target.dispatchEvent(new MouseEvent("mousemove", {
              bubbles: true,
              composed: true,
              clientX: rect.left + rect.width / 2,
              clientY: rect.top + rect.height / 2
            }));
          });
        });
      }
    </script>
  </body>
</html>
