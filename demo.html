<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style Scope · Preview</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:#e9e2d5; background:#111211; font-family:"DM Mono", ui-monospace, monospace; }
      .paper { position:relative; min-height:100vh; overflow:hidden; padding:9vw 10vw; background:radial-gradient(circle at 78% 12%, #423414 0, transparent 24%), #141414; }
      .paper::before { content:""; position:absolute; inset:0; opacity:.18; pointer-events:none; background-image:linear-gradient(90deg, transparent 49.8%, rgba(248,234,205,.18) 50%, transparent 50.2%), linear-gradient(rgba(248,234,205,.08) 1px, transparent 1px); background-size:100% 100%, 100% 42px; }
      .kicker { position:relative; color:#f1b84a; font-size:10px; letter-spacing:.18em; }
      h1 { position:relative; max-width:820px; margin:19px 0 52px; font:500 clamp(52px, 8vw, 116px)/.86 "Playfair Display", Georgia, serif; letter-spacing:-.06em; }
      h1 i { color:#f1b84a; font-style:italic; }
      .frame { position:relative; display:grid; grid-template-columns:1fr 1.4fr; max-width:860px; min-height:300px; border:1px solid rgba(241,184,74,.7); }
      .copy { padding:36px; border-right:1px solid rgba(241,184,74,.35); }.copy p { max-width:290px; color:#aaa398; font:16px/1.6 "Playfair Display", Georgia, serif; }.copy button { display:inline-flex; align-items:center; gap:9px; padding:12px 15px; color:#1c160b; border:0; background:#f1b84a; font:500 11px "DM Mono", monospace; letter-spacing:.08em; }.copy button > span { pointer-events:none; }.button-icon { font-size:15px; line-height:1; }
      .swatches { display:flex; align-items:end; gap:13px; padding:36px; }.swatch { flex:1; height:168px; background:#e6785e; box-shadow:10px 10px 0 rgba(255,255,255,.07); }.swatch:nth-child(2) { height:224px; border-radius:90px 90px 0 0; background:#78b9ad; }.swatch:nth-child(3) { height:112px; border:1px solid #e9e2d5; background:transparent; }.hint { position:fixed; right:24px; bottom:20px; color:#918b80; font-size:10px; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <main class="paper">
      <div class="kicker">A MATERIAL STUDY · 2025</div>
      <h1>Every surface<br>has a <i>story.</i></h1>
      <section class="frame">
        <div class="copy"><p>打开 Style Scope 后，把光标移到此页任意元素上，即可看到它的完整计算样式。</p><button><span class="button-icon" aria-hidden="true">✦</span><span>EXPLORE MATERIAL</span></button></div>
        <div class="swatches"><div class="swatch"></div><div class="swatch"></div><div class="swatch"></div></div>
      </section>
      <div class="hint">STYLE SCOPE / HOVER ANY ELEMENT</div>
    </main>
    <script>
      // 演示页用极小的扩展 API 桩启用真实的内容脚本；正式使用时由浏览器扩展提供这些 API。
      window.chrome = {
        runtime: { onMessage: { addListener() {} } },
        storage: { local: { get(defaults, callback) { callback({ ...defaults, enabled: true }); } } }
      };
    </script>
    <script src="content.js?v=1.2.0"></script>
    <script>
      // 仅供截图演示：距离或包含关系的测量，普通演示页不会执行。
      const previewParams = new URLSearchParams(location.search);
      const containmentPreview = previewParams.has("containment-preview");
      if (previewParams.has("distance-preview") || containmentPreview) {
        requestAnimationFrame(() => {
          const source = document.querySelector(containmentPreview ? ".copy" : ".copy button");
          const target = document.querySelector(containmentPreview ? ".copy button" : ".swatch:nth-child(3)");
          source.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
          requestAnimationFrame(() => {
            const rect = target.getBoundingClientRect();
            target.dispatchEvent(new MouseEvent("mousemove", {
              bubbles: true,
              composed: true,
              clientX: rect.left + rect.width / 2,
              clientY: rect.top + rect.height / 2
            }));
          });
        });
      }
    </script>
  </body>
</html>
